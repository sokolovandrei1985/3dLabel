openapi: "3.0.0"
info:
  title: 3dLabel Service API
  description: API для обмена информацией с SPA 3dLabel
  version: 1.0.0

servers:
- url: https://d5dev5rt1c3b2u64bp01.y5sm01em.apigw.yandexcloud.net
paths:
  /config:
    get:
      summary: Получить конфигурационный файл
      description: Возвращает конфигурационный файл из Object Storage
      operationId: getConfig
      x-yc-apigateway-integration:
        type: object_storage
        bucket: main-config
        object: config.json
        service_account: ajei8nt90s0k0l8dsgd5
      responses:
        '200':
          description: Успешное получение конфигурационного файла
          content:
            application/json:
              schema:
                type: object
                description: Содержимое конфигурационного файла
        '404':
          description: Конфигурационный файл не найден
        '500':
          description: Ошибка при получении файла из Object Storage
  /api/save-user-state:
    post:
      summary: Сохранение состояния пользователя
      description: |
        Создает пользователя (если не существует) и сохраняет его состояние в бакет.
        Идентификация пользователя по email.
      tags:
        - User State
      operationId: saveUserState
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4ejrfuvkb1g3ago6302
        tag: "$latest"
        service_account_id: ajei8nt90s0k0l8dsgd5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - state_data
              properties:
                email:
                  type: string
                  format: email
                  description: Email пользователя (обязательный)
                  example: "user@example.com"
                surname:
                  type: string
                  description: Фамилия пользователя
                  example: "Иванов"
                name:
                  type: string
                  description: Имя пользователя
                  example: "Иван"
                phone:
                  type: string
                  description: Телефон пользователя
                  example: "+79123456789"
                state_data:
                  type: object
                  description: Данные состояния пользователя (любой JSON объект)
                  example:
                    scene_config:
                      camera_position: [0, 0, 5]
                      objects: ["model1", "model2"]
                    user_preferences:
                      theme: "dark"
                      language: "ru"
      responses:
        '200':
          description: Состояние успешно сохранено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User state saved successfully"
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 1
                      state_id:
                        type: integer
                        example: 1
                      direct_link:
                        type: string
                        example: "https://storage.yandexcloud.net/3d-user-states/user_123_state.json"
        '400':
          description: Неверные параметры запроса
        '500':
          description: Ошибка сервера

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer